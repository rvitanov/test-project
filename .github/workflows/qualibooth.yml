name: QualiBooth Accessibility Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility-scan:
    name: Accessibility Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run QualiBooth Code Analysis
        uses: docker://ghcr.io/qualibooth/qualibooth-action:v1.0.7
        env:
          QUALIBOOTH_ORG_UUID: ${{ secrets.QUALIBOOTH_ORG_UUID }}
          QUALIBOOTH_REPO: ${{ github.repository }}
          QUALIBOOTH_SHA: ${{ github.sha }}
          QUALIBOOTH_BRANCH: ${{ github.ref_name }}
          QUALIBOOTH_PROJECT_TYPE: react
          QUALIBOOTH_SCAN_PATHS: src/
          QUALIBOOTH_FAIL_ON_ISSUES: "false"
          QUALIBOOTH_API_URL: https://pipelinein.dev.qualibooth.com