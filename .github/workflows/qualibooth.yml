name: QualiBooth Accessibility Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  accessibility-scan:
    name: Accessibility Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run QualiBooth code analysis
        id: qualibooth
        uses: QualiBooth/code-analysis@41eb7d3ad98d5b2b99423528a2c8de2ce34dd011
        with:
          org-uuid: "${{ secrets.QUALIBOOTH_ORG_UUID }}"
          api-token: "${{ secrets.QUALIBOOTH_API_TOKEN }}"
          project-type: react
          scan-paths: src/
          fail-on-issues: "false"

      - name: Print issues found
        env:
          ISSUES: "${{ steps.qualibooth.outputs.issues-found }}"
        run: |
          echo "Accessibility issues found: $ISSUES"
