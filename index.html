<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Corp</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: sans-serif; color: #222; }
      nav { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
      nav .logo { font-weight: bold; font-size: 1.2rem; }
      nav ul { list-style: none; display: flex; gap: 1.5rem; }
      nav a { color: white; text-decoration: none; }
      main { padding: 2rem; max-width: 900px; margin: 0 auto; }
      footer { background: #f5f5f5; padding: 1rem 2rem; text-align: center; margin-top: 3rem; }
      h1 { margin-bottom: 1rem; }
      h2 { margin: 1.5rem 0 0.75rem; }
      p { margin-bottom: 0.75rem; line-height: 1.6; }
      form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 500px; }
      input, textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 0.5rem 1rem; cursor: pointer; background: #1a1a2e; color: white; border: none; border-radius: 4px; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      td, th { border: 1px solid #ddd; padding: 0.5rem 1rem; text-align: left; }
      th { background: #f0f0f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
